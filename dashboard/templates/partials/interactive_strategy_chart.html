<div class="chart-card" style="margin:18px 0;padding:14px;border:1px solid var(--line,#30363d);border-radius:12px;background:linear-gradient(145deg,var(--panel,#161b22),#10151d);box-shadow:0 8px 24px rgba(0,0,0,.16)">
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px">
    <strong style="font-size:16px">Interactive Strategy Chart</strong><span class="muted" style="font-size:12px">Zoom, pan, rescale axes, or use Auto Fit.</span>
    <label>Symbol <input id="strategy-chart-symbol" value="{{ chart_symbol|default('GLD') }}" style="width:75px"></label>
    <label>TF <select id="strategy-chart-tf"><option {% if chart_default_tf|default("15m") == "5m" %}selected{% endif %}>5m</option><option {% if chart_default_tf|default("15m") == "15m" %}selected{% endif %}>15m</option><option {% if chart_default_tf|default("15m") == "1h" %}selected{% endif %}>1h</option><option {% if chart_default_tf|default("15m") == "1d" %}selected{% endif %}>1d</option></select></label>
    <label><input type="checkbox" id="chart-ema20" checked> EMA20</label>
    <label><input type="checkbox" id="chart-ema50" checked> EMA50</label>
    <label><input type="checkbox" id="chart-ema200"> EMA200</label>
    <label><input type="checkbox" id="chart-vwap" checked> VWAP</label>
    <button id="chart-load">Load / Refresh</button>
    <button id="chart-fit">Auto Fit</button>
    <button id="chart-reset">Reset Zoom</button>
    <span id="chart-status" class="muted">Ready</span>
  </div>
  <div id="strategy-chart" style="width:100%;height:560px"></div>
</div>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  let chartData=null, lastTrades=[];
  const key="{{ chart_strategy|default('strategy') }}";
  const fmt=v=>typeof v==='number'&&isFinite(v)?v.toFixed(2):'';
  function render(){
    if(!chartData)return;
    const o=chartData.ohlcv, x=o.map(r=>r.t);
    const c={x,open:o.map(r=>r.o),high:o.map(r=>r.h),low:o.map(r=>r.l),close:o.map(r=>r.c),type:'candlestick',name:chartData.symbol,
      increasing:{line:{color:'#3fb950'},fillcolor:'#3fb950'},decreasing:{line:{color:'#f85149'},fillcolor:'#f85149'}};
    const ind=chartData.indicators||{}, traces=[c];
    if($('chart-ema20').checked) traces.push({x,y:ind.ema20,name:'EMA20',type:'scatter',mode:'lines',connectgaps:false});
    if($('chart-ema50').checked) traces.push({x,y:ind.ema50,name:'EMA50',type:'scatter',mode:'lines',connectgaps:false});
    if($('chart-ema200').checked) traces.push({x,y:ind.ema200,name:'EMA200',type:'scatter',mode:'lines',connectgaps:false});
    if($('chart-vwap').checked) traces.push({x,y:ind.vwap,name:'VWAP',type:'scatter',mode:'lines',connectgaps:false});
    const entries=[],exits=[];
    (lastTrades||[]).forEach(t=>{
      if(t.entry_time&&isFinite(Number(t.entry))) entries.push({x:t.entry_time,y:Number(t.entry),text:(t.side||'')+' entry',kind:'entry'});
      if(t.exit_time&&isFinite(Number(t.exit||t.exit_price))) exits.push({x:t.exit_time,y:Number(t.exit||t.exit_price),text:(t.side||'')+' exit',kind:'exit'});
    });
    if(entries.length)traces.push({x:entries.map(z=>z.x),y:entries.map(z=>z.y),text:entries.map(z=>z.text),name:'Entries',type:'scatter',mode:'markers',marker:{size:10,symbol:'triangle-up'}});
    if(exits.length)traces.push({x:exits.map(z=>z.x),y:exits.map(z=>z.y),text:exits.map(z=>z.text),name:'Exits',type:'scatter',mode:'markers',marker:{size:9,symbol:'triangle-down'}});
    const layout={
      title:{text:(chartData.symbol||'')+' · '+(chartData.timeframe||'')+' · Strategy overlay',font:{size:16}},
      paper_bgcolor:'#161b22',plot_bgcolor:'#0d1117',font:{color:'#c9d1d9'},
      dragmode:'zoom',hovermode:'x unified',showlegend:true,
      margin:{l:52,r:24,t:48,b:42},height:560,
      xaxis:{type:'date',autorange:true,fixedrange:false,showspikes:true,spikemode:'across',spikesnap:'cursor',
        rangeselector:{buttons:[{count:1,label:'1D',step:'day',stepmode:'backward'},{count:5,label:'5D',step:'day',stepmode:'backward'},{count:1,label:'1M',step:'month',stepmode:'backward'},{count:3,label:'3M',step:'month',stepmode:'backward'},{step:'all',label:'All'}],font:{size:11}}},
      yaxis:{autorange:true,fixedrange:false,side:'right',showspikes:true,spikemode:'across'},
      legend:{orientation:'h',y:1.02,x:0},
      uirevision:key
    };
    Plotly.react('strategy-chart',traces,layout,{responsive:true,displaylogo:false,scrollZoom:true});
  }
  async function load(){
    const symbol=($('strategy-chart-symbol').value||'GLD').trim().toUpperCase();
    const tf=$('strategy-chart-tf').value;
    const rawN=Number((document.getElementById('bars')||{}).value)||1560;
    const caps={'5m':6000,'15m':6000,'1h':3000,'1d':1500};
    const n=Math.min(rawN,caps[tf]||6000);
    $('chart-status').textContent='Loading…';
    try{
      const r=await fetch('/api/strategy-chart',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol,n_bars:n,timeframe:tf})});
      const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'Chart request failed');
      chartData=d;render();$('chart-status').textContent='Loaded '+d.bars+' bars';
    }catch(e){$('chart-status').textContent='Error: '+e.message}
  }
  $('chart-load').onclick=load;
  ['chart-ema20','chart-ema50','chart-ema200','chart-vwap'].forEach(id=>$(id).onchange=render);
  $('chart-fit').onclick=()=>{if(window.Plotly)Plotly.relayout('strategy-chart',{'xaxis.autorange':true,'yaxis.autorange':true})};
  $('chart-reset').onclick=()=>{if(window.Plotly)Plotly.relayout('strategy-chart',{'xaxis.autorange':true,'yaxis.autorange':true})};
  window.addEventListener('strategy-result',e=>{
    const d=e.detail||{};
    if(d.symbol)$('strategy-chart-symbol').value=d.symbol;
    if(d.chart_timeframe)$('strategy-chart-tf').value=d.chart_timeframe;
    lastTrades=d.trades||[];
    // Do not automatically make another market-data request after a backtest.
    // The trade overlay is ready immediately; Load / Refresh fetches candles on demand.
    if(chartData)render();
    else $('chart-status').textContent='Trade result ready — load chart when needed';
  });
  window.strategyChartLoad=load;
  window.strategyChartSetSymbol=s=>{if(s)$('strategy-chart-symbol').value=s};
  window.strategyChartKey=key;
})();
</script>
