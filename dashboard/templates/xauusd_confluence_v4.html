<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XAUUSD Confluence V4</title><style>body{font-family:Arial,sans-serif;background:#0d1117;color:#c9d1d9;padding:24px;max-width:1100px;margin:auto}.box{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:18px;margin:14px 0}input{background:#0d1117;color:#c9d1d9;border:1px solid #30363d;padding:8px;width:110px;margin:4px}button{padding:10px 18px;font-weight:bold;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #30363d;text-align:right}td:first-child,th:first-child{text-align:left}.muted{color:#8b949e}.sig{font-weight:bold}</style></head><body><h1>Gold Confluence V4 (GLD / Alpaca)</h1><p class="muted">4H + 1H + 15m context → 5m execution. Fibonacci, liquidity sweep, FVG/IFVG, supply/demand, BOS/MSS and displacement.</p><div class="box"><h3>Run</h3><label>Symbol <input id="symbol" value="GLD"></label><label>Bars <input id="bars" type="number" value="30000"></label><label>Min score <input id="score" type="number" value="12"></label><label>Risk % <input id="risk" type="number" step="0.05" value="0.5"></label><br><button onclick="run()">Run Live 5m Backtest</button><span id="status" class="muted"></span></div><div class="box"><h3>Metrics</h3><table id="metrics"></table></div><div class="box"><h3>Recent Trades</h3><table id="trades"></table></div><script>async function run(){status.textContent=' Loading Alpaca GLD 5m data and testing...';try{let r=await fetch('/api/xauusd-confluence-v4/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:symbol.value.trim().toUpperCase(),data_source:'alpaca',n_bars:+bars.value,config:{min_score:+score.value,risk_pct:+risk.value}})});let d=await r.json();if(!r.ok)throw Error(d.error);metrics.innerHTML=Object.entries(d.metrics).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');let t=d.trades;trades.innerHTML=t.length?'<tr>'+Object.keys(t[0]).map(k=>`<th>${k}</th>`).join('')+'</tr>'+t.map(x=>'<tr>'+Object.values(x).map(v=>`<td>${v}</td>`).join('')+'</tr>').join(''):'<tr><td>No trades</td></tr>';status.textContent=` Done. ${d.symbol} | ${d.bars} bars | ${d.data_start} → ${d.data_end}`}catch(e){status.textContent=' Error: '+e.message}}</script></body></html>
