name: Browser smoke tests

on:
  push:
    branches: [GPTver_confluence_v4]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed app URL (leave blank to use the configured default)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_TEST_BASE_URL: ${{ inputs.base_url || vars.PLAYWRIGHT_TEST_BASE_URL || 'https://tv-gpt-alp-v2-gpt.onrender.com' }}
      PLAYWRIGHT_DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: python -m pytest -q tests/test_browser_smoke.py
      - name: Upload screenshots and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
