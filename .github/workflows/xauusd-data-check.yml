name: XAUUSD data pipeline tests

on:
  push:
    branches: [GPTver_confluence_v4]
    paths:
      - 'scripts/xauusd_data_pipeline.py'
      - 'scripts/download_dukascopy_xauusd.py'
      - 'docs/XAUUSD_DATA_LIBRARY.md'
      - 'research/backtest_replay_routes.py'
      - 'research/backtest_engine.py'
      - 'research/xauusd_sdb.py'
      - 'research/strategies/fibonacci_golden_box.py'
      - 'tests/test_fibonacci_golden_box.py'
      - 'tests/test_backtest_replay_template.py'
      - 'tests/test_xauusd_sdb.py'
      - 'dashboard/templates/backtest_replay.html'
      - 'dashboard/templates/dashboard.html'
      - 'tests/test_xauusd_data_pipeline.py'
      - '.github/workflows/xauusd-data-check.yml'
  pull_request:
    branches: [GPTver_confluence_v4]
    paths:
      - 'scripts/xauusd_data_pipeline.py'
      - 'scripts/download_dukascopy_xauusd.py'
      - 'docs/XAUUSD_DATA_LIBRARY.md'
      - 'research/backtest_replay_routes.py'
      - 'research/backtest_engine.py'
      - 'research/strategies/fibonacci_golden_box.py'
      - 'research/xauusd_sdb.py'
      - 'tests/test_fibonacci_golden_box.py'
      - 'tests/test_backtest_replay_template.py'
      - 'tests/test_xauusd_sdb.py'
      - 'dashboard/templates/backtest_replay.html'
      - 'dashboard/templates/dashboard.html'
      - 'tests/test_xauusd_data_pipeline.py'
      - '.github/workflows/xauusd-data-check.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.2 requests==2.32.3 pytest
      - run: python -m compileall -q scripts research/backtest_replay_routes.py research/backtest_engine.py research/xauusd_sdb.py
      - name: Check Replay browser JavaScript syntax
        run: |
          python -c "import re; from pathlib import Path; h=Path('dashboard/templates/backtest_replay.html').read_text(); Path('/tmp/replay.js').write_text(re.findall(r'<script>(.*?)</script>', h, re.S)[-1])"
          node --check /tmp/replay.js
      - run: python -m unittest tests.test_xauusd_data_pipeline -v
      - run: python -m pytest tests/test_fibonacci_golden_box.py tests/test_backtest_replay_template.py -q
      - name: Live Dukascopy source smoke test (two historical days)
        id: dukascopy-live-smoke
        continue-on-error: true
        run: python scripts/download_dukascopy_xauusd.py --from 2025-01-02 --to 2025-01-03 --price-side BID --out /tmp/xauusd-smoke
      - name: Report live provider availability
        if: steps.dukascopy-live-smoke.outcome == 'failure'
        run: echo '::warning::Unit tests passed, but the optional live Dukascopy smoke test timed out or failed. This is a provider-availability warning, not a parser/unit-test failure.'
