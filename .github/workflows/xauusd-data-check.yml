name: XAUUSD data pipeline tests

on:
  push:
    branches: [GPTver_confluence_v4]
    paths:
      - 'scripts/xauusd_data_pipeline.py'
      - 'scripts/download_dukascopy_xauusd.py'
      - 'docs/XAUUSD_DATA_LIBRARY.md'
      - 'tests/test_xauusd_data_pipeline.py'
      - '.github/workflows/xauusd-data-check.yml'
  pull_request:
    branches: [GPTver_confluence_v4]
    paths:
      - 'scripts/xauusd_data_pipeline.py'
      - 'scripts/download_dukascopy_xauusd.py'
      - 'docs/XAUUSD_DATA_LIBRARY.md'
      - 'tests/test_xauusd_data_pipeline.py'
      - '.github/workflows/xauusd-data-check.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.2 requests==2.32.3
      - run: python -m unittest tests.test_xauusd_data_pipeline -v
      - name: Live Dukascopy source smoke test (two historical days)
        run: python scripts/download_dukascopy_xauusd.py --from 2025-01-02 --to 2025-01-03 --price-side BID --out /tmp/xauusd-smoke
